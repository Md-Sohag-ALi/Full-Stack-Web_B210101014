```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Full Practice</title>

    <!-- 🔗 External CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Full Practice</h1>

    <!-- ID -->
    <div id="box">This is ID selector</div>

    <!-- Class -->
    <h2 class="heading">Class Selector Example</h2>

    <!-- Text -->
    <p>This is text properties example</p>

    <!-- Box Model -->
    <div class="box-model">Box Model</div>

    <!-- Display -->
    <span class="inline">Inline</span>
    <div class="block">Block</div>

    <!-- Opacity -->
    <div class="opacity-box"></div>

    <!-- Position -->
    <div class="position-box">Position</div>

    <!-- Z-index -->
    <div class="z1">Z1</div>
    <div class="z2">Z2</div>

    <!-- Flexbox -->
    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <!-- Background -->
    <div class="bg"></div>

    <!-- Transition -->
    <div class="transition-box"></div>

    <!-- Animation -->
    <div class="loader"></div>

    <!-- Media Query -->
    <div class="media-box"></div>

</body>
</html>
```
